<!doctype html>
<html lang="ku" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0869c9">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="FirstESIM Admin">
<title>FirstESIM — Admin Panel</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f8fd;color:#172033;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
button,input,select{font:inherit}.wrap{max-width:900px;margin:auto;padding:22px 14px 60px}
h1{color:#0869c9;text-align:center;font-size:38px;margin:20px 0 28px;font-weight:900}
.card{background:#fff;border-radius:24px;padding:20px;margin:14px 0;box-shadow:0 5px 25px #0b376014}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
input,select{width:100%;border:2px solid #e0e5ec;border-radius:15px;padding:14px;outline:0;background:#fff}
.btn{border:0;border-radius:14px;padding:13px 18px;font-weight:900;cursor:pointer}.blue{background:#0869c9;color:#fff}.green{background:#168a4b;color:#fff}.gray{background:#eef2f7;color:#27364c}
.status{font-weight:900;margin-top:10px}.ok{color:#168a4b}.err{color:#d22}
.order{border:1px solid #e5ebf2;border-radius:20px;padding:16px;margin:12px 0;background:#fbfdff}
.order h3{margin:0 0 8px;color:#0869c9}.meta{line-height:1.9;color:#3c4b61}.actions{display:grid;gap:10px;margin-top:14px}
.small{font-size:13px;color:#64748b}.badge{display:inline-block;border-radius:999px;padding:6px 10px;background:#eef5ff;color:#0869c9;font-weight:800}
.notice{background:#fff8df;border:1px solid #f2df8b;padding:13px;border-radius:15px;line-height:1.7}
@media(min-width:700px){.actions{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="wrap">
<h1>FirstESIM — Admin Panel</h1>
<section class="card">
<div class="row"><input id="key" type="password" placeholder="Admin Key"><button class="btn blue" onclick="loadOrders()">Orders کردنەوە</button></div>
<div id="loginStatus" class="status"></div>
</section>
<section class="card">
<h2>🔔 Push Notification</h2>
<p class="small">ئەم دوگمەیە لە iPhone ـی Admin تەنها یەکجار پێویستە.</p>
<button id="pushBtn" class="btn green" onclick="enablePush()">🔔 Enable Notifications</button>
<div id="pushStatus" class="status"></div>
<div class="notice" style="margin-top:12px">کاتێک کڕیار Order ـێکی نوێ دروست دەکات، ئاگادارکردنەوە بۆ ئەم iPhone ـە دێت.</div>
</section>
<section class="card">
<div class="row" style="justify-content:space-between"><h2 style="margin:0">Orders</h2><button class="btn gray" onclick="loadOrders()">🔄 نوێکردنەوە</button></div>
<div id="orders">هیچ Order ـێک نییە.</div>
</section>
</div>
<script>
const API="https://firstesim-api.onrender.com";
let ADMIN_KEY=localStorage.getItem("firstesim_admin_key")||"";
const $=id=>document.getElementById(id);
$("key").value=ADMIN_KEY;
function setStatus(id,msg,ok=false){$(id).textContent=msg||"";$(id).className="status "+(ok?"ok":"err")}
function authHeaders(extra={}){return Object.assign({"x-admin-key":ADMIN_KEY},extra)}
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function statusKu(s){return ({waiting_payment_check:"چاوەڕوانی پشکنینی پارەدان",payment_confirmed:"پارەدان پشتڕاست کرا",esim_ready:"eSIM ئامادەیە",completed:"تەواو کرا",cancelled:"هەڵوەشێنرایەوە"})[s]||s||"نادیار"}
async function loadOrders(){
 ADMIN_KEY=$("key").value.trim(); if(!ADMIN_KEY){setStatus("loginStatus","تکایە Admin Key بنووسە.");return}
 localStorage.setItem("firstesim_admin_key",ADMIN_KEY);
 try{const r=await fetch(API+"/api/admin/orders",{headers:authHeaders()});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||"Unauthorized");setStatus("loginStatus","Orders بە سەرکەوتوویی بارکرا.",true);renderOrders(d.orders||[])}
 catch(e){setStatus("loginStatus","کێشە: "+e.message)}
}
function renderOrders(list){
 if(!list.length){$("orders").innerHTML='<div class="small" style="padding:25px 0;text-align:center">هیچ Order ـێک نییە.</div>';return}
 $("orders").innerHTML=list.map(o=>`<article class="order">
<h3>🆕 ${esc(o.id)}</h3><div class="meta">🌍 <b>وڵات:</b> ${esc(o.country)}<br>📦 <b>پلان:</b> ${esc(o.plan)}<br>💰 <b>نرخ:</b> ${esc(o.price)}<br>💳 <b>پارەدان:</b> ${esc(o.payment)}<br>📌 <b>دۆخ:</b> <span class="badge">${esc(statusKu(o.status))}</span></div>
${o.receiptUrl?`<p><a href="${esc(API+o.receiptUrl)}" target="_blank">📎 بینینی پسوڵە</a></p>`:""}
<div class="actions"><select id="status-${esc(o.id)}"><option value="waiting_payment_check">چاوەڕوانی پشکنینی پارەدان</option><option value="payment_confirmed">پارەدان پشتڕاست کرا</option><option value="esim_ready">eSIM ئامادەیە</option><option value="completed">تەواو کرا</option><option value="cancelled">هەڵوەشێنرایەوە</option></select>
<button class="btn blue" onclick="changeStatus('${esc(o.id)}')">گۆڕینی دۆخ</button>
<input id="qr-${esc(o.id)}" type="file" accept="image/*,.png,.jpg,.jpeg">
<input id="code-${esc(o.id)}" type="text" placeholder="Activation Code (ئەگەر هەیە)">
<button class="btn green" onclick="uploadQR('${esc(o.id)}')">📲 Upload QR و ناردن بۆ کڕیار</button></div></article>`).join("");
 list.forEach(o=>{const s=$("status-"+o.id);if(s)s.value=o.status||"waiting_payment_check"})
}
async function changeStatus(id){
 try{const status=$("status-"+id).value;const r=await fetch(API+"/api/admin/orders/"+encodeURIComponent(id)+"/status",{method:"POST",headers:authHeaders({"Content-Type":"application/json"}),body:JSON.stringify({status})});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||"Status failed");await loadOrders()}catch(e){alert("کێشە: "+e.message)}
}
async function uploadQR(id){
 const file=$("qr-"+id).files[0],code=$("code-"+id).value.trim();if(!file){alert("تکایە وێنەی QR هەڵبژێرە.");return}
 const fd=new FormData();fd.append("qr",file);if(code)fd.append("activationCode",code);
 try{const r=await fetch(API+"/api/admin/orders/"+encodeURIComponent(id)+"/qr",{method:"POST",headers:authHeaders(),body:fd});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||"QR upload failed");alert("QR بە سەرکەوتوویی نێردرا.");await loadOrders()}catch(e){alert("کێشە: "+e.message)}
}
function urlBase64ToUint8Array(s){const p="=".repeat((4-s.length%4)%4),b=(s+p).replace(/-/g,"+").replace(/_/g,"/"),r=atob(b);return Uint8Array.from([...r].map(c=>c.charCodeAt(0)))}
async function enablePush(){
 ADMIN_KEY=$("key").value.trim();if(!ADMIN_KEY){setStatus("pushStatus","سەرەتا Admin Key بنووسە.");return}
 localStorage.setItem("firstesim_admin_key",ADMIN_KEY);
 if(!("Notification"in window)||!("serviceWorker"in navigator)||!("PushManager"in window)){setStatus("pushStatus","Push Notification پشتگیری ناکرێت.");return}
 try{
  const permission=await Notification.requestPermission();if(permission!=="granted"){setStatus("pushStatus","Notification ڕێگەپێدان نەدرا.");return}
  const reg=await navigator.serviceWorker.register("/sw-admin.js",{scope:"/"});await navigator.serviceWorker.ready;
  const pk=await fetch(API+"/api/admin/push/public-key",{headers:authHeaders()});const kd=await pk.json().catch(()=>({}));if(!pk.ok||!kd.publicKey)throw new Error(kd.error||"Public key نەدۆزرایەوە.");
  let sub=await reg.pushManager.getSubscription();if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:urlBase64ToUint8Array(kd.publicKey)});
  const sr=await fetch(API+"/api/admin/push/subscribe",{method:"POST",headers:authHeaders({"Content-Type":"application/json"}),body:JSON.stringify(sub.toJSON())});const sd=await sr.json().catch(()=>({}));if(!sr.ok)throw new Error(sd.error||"Subscribe failed");
  setStatus("pushStatus","✅ Notifications چالاک کرا.",true);$("pushBtn").textContent="🔔 Notifications Enabled";
 }catch(e){setStatus("pushStatus","کێشە: "+e.message)}
}
(async()=>{try{if("serviceWorker"in navigator)await navigator.serviceWorker.register("/sw-admin.js",{scope:"/"})}catch(e){}if("Notification"in window&&Notification.permission==="granted")$("pushBtn").textContent="🔔 Notifications Enabled";if(ADMIN_KEY)loadOrders()})();
</script>
</body>
</html>
